{% extends "layouts/base.html" %}
{% block title %} Book List {% endblock title %}

{% block content %}
<div style="margin: 20px;">
    <h2>Library Books (Simple Query)</h2>
    
    {% for obj in books %}
        <p><strong>ID:</strong> {{ obj.id }} | <strong>Title:</strong> {{ obj.title }} | <strong>Author:</strong> {{ obj.author }}</p>
        <hr>
    {% endfor %}
    
</div>
{% endblock content %}
