{% extends "layouts/base.html" %}
{% block title %} تعديل بيانات الكتاب {% endblock %}

{% block content %}
<div style="margin: 20px;">
    <h2>تعديل كتاب: {{ book.title }} ✏️</h2>
    <hr>
    <!-- نرسل البيانات لنفس مسار التعديل مع رقم الـ ID -->
    <form method="POST" action="/books/lab9_part1/editbook/{{ book.id }}/">
        {% csrf_token %}
        
        <label>عنوان الكتاب:</label><br>
        <!-- لاحظ استخدام value لعرض القيمة الحالية -->
        <input type="text" name="title" value="{{ book.title }}" required style="margin-bottom: 10px; padding: 5px; width: 300px;"><br>
        
        <label>السعر:</label><br>
        <input type="number" step="0.01" name="price" value="{{ book.price }}" required style="margin-bottom: 15px; padding: 5px; width: 300px;"><br>
        
        <button type="submit" style="padding: 10px 20px; background-color: orange; color: white; border: none; cursor: pointer;">حفظ التعديلات</button>
        <a href="/books/lab9_part1/listbooks/" style="margin-right: 15px; color: red; text-decoration: none;">إلغاء</a>
    </form>
</div>
{% endblock content %}
