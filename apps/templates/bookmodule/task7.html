{% extends "layouts/base.html" %}
{% block title %} Students per City {% endblock %}

{% block content %}
<div style="margin: 20px;">
    <h2>عدد زوار المكتبة في كل مدينة 🌍</h2>
    <hr>
    <ul style="font-size: 18px; line-height: 2;">
        {% for obj in cities %}
            <li><strong>مدينة {{ obj.city }}:</strong> {{ obj.student_count }} طلاب</li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
