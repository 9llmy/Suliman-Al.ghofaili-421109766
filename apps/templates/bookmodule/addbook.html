{% extends "layouts/base.html" %}
{% block title %} إضافة كتاب جديد {% endblock %}

{% block content %}
<div style="margin: 20px;">
    <h2>إضافة كتاب جديد 📝</h2>
    <hr>
    <!-- الفورم يستخدم طريقة POST للرابط الخاص بالإضافة -->
    <form method="POST" action="/books/lab9_part1/addbook/">
        <!-- تعويذة الحماية الخاصة بجانغو (مهمة جداً مع أي POST) -->
        {% csrf_token %}
        
        <label>عنوان الكتاب:</label><br>
        <input type="text" name="title" required style="margin-bottom: 10px; padding: 5px; width: 300px;"><br>
        
        <label>السعر:</label><br>
        <input type="number" step="0.01" name="price" required style="margin-bottom: 15px; padding: 5px; width: 300px;"><br>
        
        <button type="submit" style="padding: 10px 20px; background-color: blue; color: white; border: none; cursor: pointer;">حفظ الكتاب</button>
        <a href="/books/lab9_part1/listbooks/" style="margin-right: 15px; color: red; text-decoration: none;">إلغاء</a>
    </form>
</div>
{% endblock content %}
